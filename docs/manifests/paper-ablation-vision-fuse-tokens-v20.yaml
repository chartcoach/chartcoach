schema_version: 1

run:
  scenarios: evals/scenarios/spec.yaml
  catalog_uri: guidelines/catalog.parquet
  purge: false
  k: 16
  strategies:
    - ann-dense@v1
    - dense-mmr@v1
    - bm25-prf@v1
    - hybrid-rrf@v1
    - sparse-splade@v1
    - dense-sparse-rrf@v1

config:
  lms:
    strategy:
      model: gpt-5.1
      temperature: 0.0
    vlm:
      model: gpt-5.2
      temperature: 0.0
    guideline_status:
      model: gpt-5.1
      temperature: 0.0

  focus:
    mode: violations
    allow_role_fallback: true
    use_status_filter: true

  chart_vision:
    enabled: true
    # Ablation: treat VLM output as a separate retrieval channel, fused by weighted RRF.
    integration: fuse_tokens
    fusion_weight: 0.75

  embedding:
    projector: sentence_transformers
    model: BAAI/bge-small-en-v1.5

