schema_version: 1

run:
  scenarios: evals/scenarios/spec.yaml
  catalog_uri: guidelines/catalog.parquet
  purge: false
  k: 16
  strategies:
    - ann-dense@v1
    - bm25-prf@v1
    - hybrid-rrf@v1
    - sparse-splade@v1
    - dense-sparse-rrf@v1
    - multirepr-rrf@v1
    - facet-fusion-hybrid@v1
    - hybrid-rrf-setselect-facility@v1

config:
  lms:
    strategy:
      model: gpt-5.1
      temperature: 0.0
    vlm:
      model: gpt-5.2
      temperature: 0.0
    guideline_status:
      model: gpt-5.1
      temperature: 0.0

  focus:
    mode: violations
    allow_role_fallback: true
    use_status_filter: true

  chart_vision:
    enabled: false

  embedding:
    projector: sentence_transformers
    model: BAAI/bge-small-en-v1.5

