packages:
  - "apps/*"
  - "packages/*"

catalogMode: prefer

catalog:
  "@fontsource/poppins": ^5.3.0
  "@orama/orama": ^3.1.18
  "@types/jsdom": ^30.0.0
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  lucide-react: ^1.31.0
  react: ^19.2.8
  react-dom: ^19.2.8
  astro: 7.2.2
  jsdom: ^30.0.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  oxlint: 1.78.0
  "@oxlint/plugins": 1.78.0
  oxlint-tsgolint: 7.0.2001

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
verifyDepsBeforeRun: install
blockExoticSubdeps: true

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  citation-js: true
  esbuild: true
  sharp: true
