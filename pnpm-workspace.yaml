packages:
  - "apps/*"
  - "packages/*"

catalogMode: prefer

catalog:
  "@fontsource/poppins": ^5.3.0
  "@types/jsdom": ^28.0.3
  "@types/node": ^26.4.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  lucide-react: ^1.41.0
  react: ^19.2.8
  react-dom: ^19.2.8
  astro: 7.1.6
  jsdom: ^30.0.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  oxlint: 1.76.0
  "@oxlint/plugins": 1.76.0
  oxlint-tsgolint: 7.0.2001

minimumReleaseAge: 2880
minimumReleaseAgeStrict: true
verifyDepsBeforeRun: install
blockExoticSubdeps: true

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  citation-js: true
  esbuild: true
  sharp: true
