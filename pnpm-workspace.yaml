packages:
  - "apps/*"
  - "packages/*"
  - "tools/release"
  - "skills"

catalogMode: prefer

catalog:
  "@fontsource/poppins": ^5.3.0
  "@types/jsdom": ^28.0.3
  "@types/node": ^26.4.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  lucide-react: ^1.41.0
  react: ^19.2.8
  react-dom: ^19.2.8
  astro: 7.3.1
  jsdom: ^30.0.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  oxlint: 1.79.0
  "@oxlint/plugins": 1.79.0
  oxlint-tsgolint: 7.0.2001
  "@duckdb/node-api": 1.5.5-r.4
  "@assistant-ui/eve": 0.0.16
  "@assistant-ui/react": 0.15.18
  radix-ui: 1.6.7
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/babel-plugin": 0.19.0
  "@stylexjs/postcss-plugin": 0.19.0
  "@stylexjs/unplugin": 0.19.0
  autoprefixer: 10.5.5
  unplugin: 2.3.11
  "@duckdb/duckdb-wasm": 1.33.1-dev57.0
  "@uwdata/mosaic-core": 0.31.0
  "@uwdata/mosaic-sql": 0.31.0
  "@langfuse/otel": 5.11.0
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-trace-base": 2.11.0
  "@t3-oss/env-nextjs": 0.13.11
  "@ai-sdk/openai": 4.0.60
  "@huggingface/transformers": 4.2.0
  "@lancedb/lancedb": 0.38.0
  ai: 7.0.93
  concurrently: 10.0.5
  env-paths: 3.0.0
  eve: 0.52.2
  just-bash: 3.4.2
  next: 16.3.4
  streamdown: 2.6.0
  zod: 4.5.4
  nitro: 3.0.260903-beta
  yaml: 2.9.0

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "refkit-js"
minimumReleaseAgeStrict: true
verifyDepsBeforeRun: install
blockExoticSubdeps: true

overrides:
  vite: "catalog:"
  # Native index tests supply vectors and use LanceDB's built-in full-text search.
  "@lancedb/lancedb>@huggingface/transformers": "-"
  "@lancedb/lancedb>openai": "-"
  "@huggingface/transformers>sharp": "0.35.4"
  # CPU inference uses ONNX Runtime's bundled binaries, not its download installer.
  "onnxruntime-node>adm-zip": "-"
  # Image staging uses the sandbox filesystem.
  "just-bash>@mongodb-js/zstd": "-"
  "just-bash>node-liblzma": "-"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
