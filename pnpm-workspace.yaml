packages:
  - "apps/*"
  - "packages/*"

catalogMode: prefer

catalog:
  "@fontsource/poppins": ^5.2.7
  "@orama/orama": ^3.1.18
  "@types/jsdom": ^28.0.3
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  lucide-react: ^1.24.0
  react: ^19.2.7
  react-dom: ^19.2.7
  astro: 7.0.3
  jsdom: ^29.1.1
  tailwindcss: ^4.3.2
  typescript: ^5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
verifyDepsBeforeRun: install
blockExoticSubdeps: true

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  citation-js: true
  esbuild: true
  sharp: true
