[project]
name = "visground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "chartcoach",
  "diskcache>=5.6.3",
  "dspy>=3.1.3",
