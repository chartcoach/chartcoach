[project]
name = "visground"
version = "0.0.0"
description = "Internal VisGround dataset, evaluation, and viewer workbench."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "altair>=5.2,<6",
  "anywidget>=0.9.21",
  "chartcoach[search]",
  "diskcache>=5.6.3",
  "dspy>=3.1",
  "duckdb>=1.5.0",
  "httpx>=0.28.1",
  "joblib>=1.5",
  "json-repair>=0.58.6",
  "kaleido>=1.2.0",
  "langfuse>=4",
  "litellm[google]>=1.82.4",
  "matplotlib>=3.10.8",
  "openinference-instrumentation-dspy>=0.1.34",
  "pandas>=2.3.3",
  "pillow>=12.1.1",
  "platformdirs>=4.9.4",
  "plotly>=6.6",
  "polars>=1.38",
  "pyarrow>=23",
  "python-slugify>=8",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "tenacity>=9.1",
  "vl-convert-python>=1.9.0.post1",
]

[tool.uv.sources]
chartcoach = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = ["marimo[recommended]>=0.20.4", "pytest>=8.4.0"]

[tool.ruff]
extend-exclude = ["data"]
force-exclude = true

[tool.ruff.format]
exclude = ["data"]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = []

[tool.ty.src]
exclude = ["data", "scripts"]
