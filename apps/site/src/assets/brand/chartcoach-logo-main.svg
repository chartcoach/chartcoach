<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Chart Coach main logo</title>
  <desc id="desc">A small editorial collage of catalog cards arranged around the Chart Coach wordmark.</desc>
  <style>
    :root {
      --cc-line: #a06a42;
      --cc-line-soft: #dbc4ac;
      --cc-fill: #f8efe4;
      --cc-fill-soft: #f2e5d7;
      --cc-fill-rose: #f3e3dd;
      --cc-fill-sand: #efe4d5;
      --cc-fill-paper: #fbf7f0;
      --cc-text: #1f1a16;
      --cc-sub: #6e6256;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cc-line: #e7c7a6;
        --cc-line-soft: #6e5645;
        --cc-fill: #2a211b;
        --cc-fill-soft: #332821;
        --cc-fill-rose: #3c2c25;
        --cc-fill-sand: #342922;
        --cc-fill-paper: #241d18;
        --cc-text: #f6efe8;
        --cc-sub: #d9cbc0;
      }
    }
  </style>
  <rect width="720" height="420" fill="none"/>
  <g opacity="0.75">
    <path d="M108 118c78-42 166-62 255-62 94 0 176 20 250 58" fill="none" stroke="var(--cc-line-soft)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g transform="translate(106 80) rotate(-8 82 98)">
    <rect x="16" y="20" width="132" height="180" rx="28" fill="var(--cc-fill-rose)" stroke="var(--cc-line-soft)" stroke-width="4"/>
    <path d="M38 20v-12c0-10 8-18 18-18h52c10 0 18 8 18 18v12" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 56h100" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <rect x="44" y="78" width="76" height="54" rx="10" fill="var(--cc-fill-paper)" stroke="var(--cc-line)" stroke-width="4"/>
    <path d="M52 122l14-15 10 9 22-24" fill="none" stroke="var(--cc-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M89 146h26" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <path d="M49 156h44" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(288 44)">
    <rect x="26" y="38" width="168" height="230" rx="34" fill="var(--cc-fill-paper)" stroke="var(--cc-line)" stroke-width="5"/>
    <path d="M56 38v-16c0-12 10-22 22-22h64c12 0 22 10 22 22v16" fill="none" stroke="var(--cc-line)" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 84h132" fill="none" stroke="var(--cc-line-soft)" stroke-width="5" stroke-linecap="round"/>
    <rect x="66" y="104" width="88" height="60" rx="12" fill="var(--cc-fill-soft)" stroke="var(--cc-line)" stroke-width="5"/>
    <path d="M78 150l18-18 14 12 28-29" fill="none" stroke="var(--cc-line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M121 121h22v22" fill="none" stroke="var(--cc-line)" stroke-width="5" stroke-linecap="round"/>
    <text x="110" y="206" text-anchor="middle" fill="var(--cc-text)" font-family="Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="28" letter-spacing="1.2">chart coach</text>
    <text x="110" y="224" text-anchor="middle" fill="var(--cc-sub)" font-family="Inter, 'Helvetica Neue', 'Segoe UI', sans-serif" font-size="9.4" letter-spacing="0.18em">GROUNDED VISUALIZATION GUIDANCE</text>
  </g>

  <g transform="translate(496 104) rotate(8 72 92)">
    <rect x="18" y="24" width="120" height="164" rx="28" fill="var(--cc-fill-sand)" stroke="var(--cc-line-soft)" stroke-width="4"/>
    <path d="M38 24v-10c0-10 8-18 18-18h44c10 0 18 8 18 18v10" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 56h88" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 86h72" fill="none" stroke="var(--cc-line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 108h54" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 132h64" fill="none" stroke="var(--cc-line-soft)" stroke-width="4" stroke-linecap="round"/>
    <rect x="42" y="144" width="42" height="18" rx="9" fill="var(--cc-fill-paper)" stroke="var(--cc-line)" stroke-width="3"/>
  </g>
