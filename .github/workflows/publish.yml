name: Publish
run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find successful main CI for the tag
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --commit "$commit" \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful main CI for $RELEASE_TAG ($commit)."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/python

      - name: Download verified npm distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/npm

      - name: Check package identity and existing registry versions
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG" --allow-missing

      - name: Retain release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: prepare
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish Python package
        run: uv publish --trusted-publishing always dist/release/python/*.tar.gz dist/release/python/*.whl

  publish-npm:
    name: Publish to npm
    needs: prepare
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolchain configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish npm package
        run: |
          for package in dist/release/npm/chartcoach-catalog-*.tgz dist/release/npm/chartcoach-[0-9]*.tgz; do
            state="$(python3 scripts/release_registry.py npm-state "$package")"
            if [ "$state" = publish ]; then
              npm publish --access public "$package"
            fi
          done

  verify-publication:
    name: Verify published packages
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Verify registry metadata and artifact bytes
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG" --wait-seconds 600

  publish-container:
    name: Publish container image
    needs: verify-publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout container recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read container version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Publish versioned image from verified npm packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          build-contexts: packages=./dist/release/npm
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          push: true
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,scope=release-container,mode=max

  verify-container:
    name: Verify public container image
    needs: publish-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published container startup
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          CHARTCOACH_PASSWORD: release-smoke-password
        run: |
          image="$IMAGE:${RELEASE_TAG#v}"
          docker run --rm --entrypoint node \
            --mount "type=bind,source=$PWD/fixtures/catalog-release,target=/catalog,readonly" \
            "$image" /opt/chartcoach/node_modules/chartcoach/cli/index.mjs doctor --catalog /catalog --json
          docker run --detach --name chartcoach-release-check \
            --publish 127.0.0.1:4273:4273 \
            --mount "type=bind,source=$PWD/fixtures/catalog-release,target=/catalog,readonly" \
            --env CHARTCOACH_CATALOG=/catalog --env CHARTCOACH_PASSWORD "$image"
          trap 'docker logs chartcoach-release-check; docker rm --force chartcoach-release-check' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:4273/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4273/)" = 401
          curl --fail --silent --show-error --user "chartcoach:$CHARTCOACH_PASSWORD" \
            http://127.0.0.1:4273/ --output "$RUNNER_TEMP/chartcoach.html"
          curl --fail --silent --show-error --user "chartcoach:$CHARTCOACH_PASSWORD" \
            http://127.0.0.1:4273/eve/v1/preferences

  release-notes:
    name: Update release notes
    needs: [verify-publication, verify-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
