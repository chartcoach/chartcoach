name: Publish
run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7

      - name: Find successful main CI for the tag
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --commit "$commit" \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful main CI for $RELEASE_TAG ($commit)."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/python

      - name: Download verified npm distribution
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/npm

      - name: Check package identity and existing registry versions
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG" --allow-missing

      - name: Retain release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Download verified release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release
      - name: Publish Python package
        run: uv publish --trusted-publishing always dist/release/python/*.tar.gz dist/release/python/*.whl

  publish-npm:
    name: Publish to npm
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolchain configuration
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download verified release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release
      - name: Publish npm package
        run: |
          state="$(python3 scripts/release_registry.py npm-state dist/release/npm/*.tgz)"
          if [ "$state" = publish ]; then
            npm publish --access public dist/release/npm/*.tgz
          fi

  verify-publication:
    name: Verify published packages
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
      - name: Download verified release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release
      - name: Verify registry metadata and artifact bytes
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG"

  release-notes:
    name: Update release notes
    needs: verify-publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
