name: Publish

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test -n "$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --commit "$GITHUB_SHA" \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

      - name: Set up consumer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Locate consumer Node.js
        id: consumer-node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check release version
        run: ./scripts/release.sh check-version "$GITHUB_REF_NAME"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.3.0
          node-version-file: package.json
          sfw: true
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build release packages
        run: |
          mkdir -p dist/release/python dist/release/npm
          uv build --package chartcoach --out-dir dist/release/python
          pnpm --filter @chartcoach/catalog build
          npm pack ./packages/catalog --ignore-scripts --pack-destination dist/release/npm

      - name: Install browser runtime
        run: pnpm --filter @chartcoach/release exec playwright install --with-deps chromium

      - name: Verify release distributions
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: |
          python packages/chartcoach/tests/verify_built_package.py --dist-dir dist/release/python
          pnpm --filter @chartcoach/release verify:npm dist/release/npm/*.tgz --node "$CONSUMER_NODE"
          python scripts/release_registry.py check dist/release --allow-missing

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download Python package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Publish Python package
        run: uv publish --trusted-publishing always dist/release/python/*.tar.gz dist/release/python/*.whl

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Publish npm package
        run: |
          state="$(python3 scripts/release_registry.py npm-state dist/release/npm/*.tgz)"
          if [ "$state" = publish ]; then
            npx --yes npm@11.12.1 publish --access public dist/release/npm/*.tgz
          fi

  verify-publication:
    name: Verify published packages
    needs:
      - publish-pypi
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Verify registry metadata and artifact bytes
        run: python3 scripts/release_registry.py check dist/release

  release-notes:
    name: Update release notes
    needs:
      - verify-publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update release notes
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json tagName; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
