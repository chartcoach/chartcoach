name: Publish

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --commit "$GITHUB_SHA" \
            --branch "${{ github.event.repository.default_branch }}" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          sfw: true
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Check release version
        run: ./scripts/release.sh check-version "${{ github.ref_name }}"

      - name: Build release packages
        run: |
          rm -rf dist/release
          mkdir -p dist/release/python dist/release/npm
          uv build --package chartcoach --out-dir dist/release/python
          npm pack ./packages/catalog --pack-destination dist/release/npm

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release
          retention-days: 7
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download Python package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Publish Python package
        run: uv publish --trusted-publishing always dist/release/python/*.tar.gz dist/release/python/*.whl

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Publish npm package
        run: npx --yes npm@11.12.1 publish --access public dist/release/npm/*.tgz

  release-notes:
    name: Update release notes
    needs:
      - publish-pypi
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Update release notes
        run: npx changelogithub@14.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
