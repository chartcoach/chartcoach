name: Publish
run-name: Publish ${{ github.event.workflow_run.head_sha || inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.event_name != 'workflow_run'
    name: Prepare verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find successful main CI for the tag
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/ci.yml \
            --commit "$commit" \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful main CI for $RELEASE_TAG ($commit)."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/python

      - name: Download verified npm distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release/npm

      - name: Check package identity and existing registry versions
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG" --allow-missing

      - name: Retain release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: prepare
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish Python package
        run: uv publish --trusted-publishing always dist/release/python/*.tar.gz dist/release/python/*.whl

  publish-npm:
    name: Publish to npm
    needs: prepare
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolchain configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish npm package
        run: |
          for package in dist/release/npm/chartcoach-catalog-*.tgz dist/release/npm/chartcoach-[0-9]*.tgz; do
            state="$(python3 scripts/release_registry.py npm-state "$package")"
            if [ "$state" = publish ]; then
              npm publish --access public "$package"
            fi
          done

  verify-publication:
    name: Verify published packages
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Verify registry metadata and artifact bytes
        run: python3 scripts/release_registry.py check dist/release --tag "$RELEASE_TAG" --wait-seconds 600

  publish-container:
    name: Publish container image
    needs: verify-publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout container recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read container version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Publish versioned image from verified npm packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          build-contexts: packages=./dist/release/npm
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          push: true
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,scope=release-container,mode=max

  verify-container:
    name: Verify public container image
    needs: publish-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published container startup
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          CHARTCOACH_PASSWORD: release-smoke-password
        run: |
          image="$IMAGE:${RELEASE_TAG#v}"
          docker run --rm --entrypoint node \
            --mount "type=bind,source=$PWD/fixtures/catalog-release,target=/catalog,readonly" \
            "$image" /opt/chartcoach/node_modules/chartcoach/cli/index.mjs doctor --catalog /catalog --json
          docker run --detach --name chartcoach-release-check \
            --publish 127.0.0.1:4273:4273 \
            --mount "type=bind,source=$PWD/fixtures/catalog-release,target=/catalog,readonly" \
            --env CHARTCOACH_CATALOG=/catalog --env CHARTCOACH_PASSWORD "$image"
          trap 'docker logs chartcoach-release-check; docker rm --force chartcoach-release-check' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:4273/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4273/)" = 401
          curl --fail --silent --show-error --user "chartcoach:$CHARTCOACH_PASSWORD" \
            http://127.0.0.1:4273/ --output "$RUNNER_TEMP/chartcoach.html"
          curl --fail --silent --show-error --user "chartcoach:$CHARTCOACH_PASSWORD" \
            http://127.0.0.1:4273/eve/v1/preferences

  release-notes:
    name: Update release notes
    needs: [verify-publication, verify-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

  resolve-preview:
    name: Resolve preview publication
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact source and preview identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/preview_release.py resolve --commit "$COMMIT"

  build-preview:
    name: Build and verify preview packages
    needs: resolve-preview
    if: needs.resolve-preview.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-preview.outputs.commit }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Stamp matching preview versions
        env:
          VERSION: ${{ needs.resolve-preview.outputs.version }}
        run: |
          python3 scripts/preview_release.py stamp --version "$VERSION"
          uv lock
      - name: Build and verify Python preview
        run: make python-build
      - name: Build npm previews
        run: |
          pnpm --dir apps/chat build
          mkdir -p dist/release/npm
          npm pack ./packages/catalog --ignore-scripts --pack-destination dist/release/npm
          npm pack ./apps/chat/dist --ignore-scripts --pack-destination dist/release/npm
      - name: Record immutable preview source provenance
        env:
          COMMIT: ${{ needs.resolve-preview.outputs.commit }}
          VERSION: ${{ needs.resolve-preview.outputs.version }}
        run: python3 scripts/preview_release.py provenance --commit "$COMMIT" --output "dist/release/chartcoach-$VERSION-provenance.json"
      - name: Check coordinated preview artifacts and write checksums
        env:
          VERSION: ${{ needs.resolve-preview.outputs.version }}
        run: python3 scripts/preview_release.py checksum --version "$VERSION"
      - name: Retain verified preview inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: |
            dist/release/*SHA256SUMS
            dist/release/*-provenance.json
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
          retention-days: 30
          if-no-files-found: error

  verify-preview:
    name: Verify preview consumers ${{ matrix.runtime }}
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          consumers: "true"
      - name: Download preview inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-packages
          path: dist/release
      - name: Install browser runtime
        run: pnpm --filter @chartcoach/release exec playwright install --with-deps chromium
      - name: Read SDK minimum Node.js version
        if: matrix.runtime == 'node'
        id: node-version
        run: |
          echo "version=$(pnpm --filter @chartcoach/release --silent minimum-node)" >> "$GITHUB_OUTPUT"
          echo "build_node=$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Set up consumer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
      - name: Locate consumer Node.js and restore build runtime
        if: matrix.runtime == 'node'
        id: consumer-node
        env:
          BUILD_NODE: ${{ steps.node-version.outputs.build_node }}
        run: |
          echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
          dirname "$BUILD_NODE" >> "$GITHUB_PATH"
      - name: Verify catalog SDK and Node.js chat consumers
        if: matrix.runtime == 'node'
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: |
          pnpm --filter @chartcoach/release verify:npm "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz --node "$CONSUMER_NODE" --minimum-dependencies
          pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz
          pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz https://artifacts.chartcoach.dev/catalog/releases/075004be49cba8fd604d3e89ed1fb2dbd1b18eebcda40fa56f5f247cc9f8aa59/release.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
        if: matrix.runtime == 'bun'
      - name: Verify Bun chat consumers
        if: matrix.runtime == 'bun'
        run: |
          for runner in bunx bun; do
            pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz --runner "$runner"
          done
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
        if: matrix.runtime == 'deno'
      - name: Verify Deno chat consumer
        if: matrix.runtime == 'deno'
        run: pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz --runner deno

  publish-preview:
    name: Publish rolling preview
    needs: [resolve-preview, verify-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
      queue: max
    environment:
      name: preview
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/previews
    permissions:
      contents: write
      pull-requests: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified preview inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-packages
          path: dist/release
      - name: Attest verified preview artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: https://github.com/chartcoach/chartcoach/blob/main/development_docs/releasing.md#preview-provenance-v1
          predicate-path: dist/release/chartcoach-${{ needs.resolve-preview.outputs.version }}-provenance.json
          subject-path: |
            dist/release/*SHA256SUMS
            dist/release/*-provenance.json
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
      - name: Verify stored preview attestation
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.resolve-preview.outputs.commit }}
          VERSION: ${{ needs.resolve-preview.outputs.version }}
        run: |
          cd dist/release/python
          wheel="chartcoach-${VERSION}-py3-none-any.whl"
          digest="$(sha256sum "$wheel")"
          bundle="sha256:${digest%% *}.jsonl"
          for attempt in 1 2 3 4 5; do
            rm -f "$bundle"
            if gh attestation download "$wheel" -R "$GITHUB_REPOSITORY" && [ -s "$bundle" ]; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            printf 'Attestation bundle unavailable on attempt %s; retrying in 2s\n' "$attempt" >&2
            sleep 2
          done
          gh attestation verify "$wheel" -R "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --predicate-type "https://github.com/chartcoach/chartcoach/blob/main/development_docs/releasing.md#preview-provenance-v1" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --format=json > "$RUNNER_TEMP/preview-provenance-verified.json"
          python3 - "$COMMIT" "$RUNNER_TEMP/preview-provenance-verified.json" <<'PY'
          import json
          import sys
          with open(sys.argv[2]) as handle:
              results = json.load(handle)
          if not any(
              result["verificationResult"]["statement"]["predicate"]["buildDefinition"]["externalParameters"]["checkoutCommit"] == sys.argv[1]
              for result in results
          ):
              sys.exit("Verified attestation does not identify the packaged source commit")
          PY
      - name: Publish immutable assets, announce, and retain newest builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.resolve-preview.outputs.commit }}
          VERSION: ${{ needs.resolve-preview.outputs.version }}
        run: python3 scripts/preview_release.py publish --commit "$COMMIT" --version "$VERSION"
