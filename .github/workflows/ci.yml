name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECK_PATHS: >-
        .github .vscode apps development_docs packages/brand packages/catalog
        AGENTS.md CONTRIBUTING.md README.md package.json pnpm-workspace.yaml vite.config.ts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript formatting
        run: printf '%s\n' "$CHECK_PATHS" | xargs vp fmt --check

      - name: Lint JavaScript
        run: printf '%s\n' "$CHECK_PATHS" | xargs vp lint

      - name: Typecheck JavaScript
        run: CHARTCOACH_SITE_CATALOG_SOURCE=../../fixtures/catalog-release vp run -r typecheck

      - name: Test JavaScript
        run: vp run -r test

      - name: Build JavaScript
        run: CHARTCOACH_SITE_CATALOG_SOURCE=../../fixtures/catalog-release vp run -r build

  python:
    name: Python package ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --package chartcoach --all-groups --all-extras

      - name: Test Python package
        run: make test

      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: make format

      - name: Lint Python
        if: matrix.python-version == '3.12'
        run: make lint

      - name: Typecheck Python
        if: matrix.python-version == '3.12'
        run: make typecheck

      - name: Build Python package
        if: matrix.python-version == '3.12'
        run: make build
