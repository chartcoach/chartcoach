name: CI
"on":
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      anti_slop: ${{ steps.select.outputs.anti_slop }}
      javascript: ${{ steps.select.outputs.javascript }}
      packages: ${{ steps.select.outputs.packages }}
      npm: ${{ steps.select.outputs.npm }}
      python: ${{ steps.select.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify pull request changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
      - name: Select checks
        id: select
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        run: node tools/ci/select.ts
  quality:
    name: JavaScript quality
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Restore Vite Task cache
        id: tasks
        uses: ./.github/actions/task-cache
        with:
          scope: quality
      - name: Check formatting and lint
        run: vp run check
      - name: Check architecture and CI tooling
        run: |-
          vp run --filter @chartcoach/architecture --filter @chartcoach/ci typecheck
          vp run --filter @chartcoach/architecture --filter @chartcoach/ci check
          vp run --filter @chartcoach/architecture --filter @chartcoach/ci test
      - name: Check unused code
        run: vp run check:unused
      - name: Test lint rules
        if: ${{ needs.changes.outputs.anti_slop == 'true' }}
        run: vp run check:anti-slop
      - name: Save Vite Task cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.tasks.outputs.key }}
        if: success() && github.event_name == 'push'
  javascript:
    name: JavaScript workspace
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: contains(fromJSON(needs.changes.outputs.packages), '@chartcoach/catalog')
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Restore Vite Task cache
        id: tasks
        uses: ./.github/actions/task-cache
        with:
          scope: workspace
      - name: Check selected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |-
          mapfile -t filters < <(jq -r '.[] | "--filter", .' <<< "$PACKAGES")
          vp run "${filters[@]}" typecheck
          vp run "${filters[@]}" check
          vp run "${filters[@]}" test
          vp run "${filters[@]}" build
      - name: Pack npm distributions
        if: ${{ needs.changes.outputs.npm == 'true' }}
        run: |-
          mkdir -p dist/release/npm
          npm pack ./packages/catalog --ignore-scripts --pack-destination dist/release/npm
          npm pack ./apps/chat/dist --ignore-scripts --pack-destination dist/release/npm
      - name: Retain npm distributions for consumer checks and publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/release/npm/*.tgz
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
          if-no-files-found: error
        if: ${{ needs.changes.outputs.npm == 'true' }}
      - name: Save Vite Task cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.tasks.outputs.key }}
        if: success() && github.event_name == 'push'
  npm-consumers:
    name: npm consumers ${{ matrix.runtime }}
    needs:
      - changes
      - javascript
    if: ${{ needs.changes.outputs.npm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node
          - bun
          - deno
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          consumers: "true"
      - name: Download npm distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist/release/npm
      - name: Install browser runtime
        timeout-minutes: 5
        run: pnpm --filter @chartcoach/release exec playwright install --with-deps chromium
      - name: Read the SDK minimum Node.js version
        if: ${{ matrix.runtime == 'node' }}
        id: node-version
        run: |-
          echo "version=$(pnpm --filter @chartcoach/release --silent minimum-node)" >> "$GITHUB_OUTPUT"
          echo "build_node=$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Set up consumer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
        if: ${{ matrix.runtime == 'node' }}
      - name: Locate consumer Node.js and restore the build runtime
        if: ${{ matrix.runtime == 'node' }}
        id: consumer-node
        env:
          BUILD_NODE: ${{ steps.node-version.outputs.build_node }}
        run: |-
          echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
          dirname "$BUILD_NODE" >> "$GITHUB_PATH"
      - name: Verify SDK and Node.js chat consumers
        if: ${{ matrix.runtime == 'node' }}
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: |-
          pnpm --filter @chartcoach/release verify:npm "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz --node "$CONSUMER_NODE" --minimum-dependencies
          pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz
          pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz https://artifacts.chartcoach.dev/catalog/releases/075004be49cba8fd604d3e89ed1fb2dbd1b18eebcda40fa56f5f247cc9f8aa59/release.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
        if: ${{ matrix.runtime == 'bun' }}
      - name: Verify Bun chat consumers
        if: ${{ matrix.runtime == 'bun' }}
        run: |-
          for runner in bunx bun; do
            pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz --runner "$runner"
          done
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
        if: ${{ matrix.runtime == 'deno' }}
      - name: Verify Deno chat consumer
        if: ${{ matrix.runtime == 'deno' }}
        run:
          pnpm --filter @chartcoach/release verify:chat "$PWD"/dist/release/npm/chartcoach-[0-9]*.tgz "$PWD"/dist/release/npm/chartcoach-catalog-*.tgz
          --runner deno
      - name: Retain chat browser screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-browser-${{ matrix.runtime }}
          path: .context/chat-package-*.png
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
        if: always()
  python-minimum:
    name: Python minimum dependencies
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.10"
      - name: Test minimum dependency versions
        run: make python-minimum
  python:
    name: Python package ${{ matrix.python-version }}
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: uv sync --locked --package chartcoach --all-groups --all-extras
      - name: Test Python package
        run: make python-test
      - name: Check Python format
        if: ${{ matrix.python-version == '3.12' }}
        run: make python-format
      - name: Check Python lint
        if: ${{ matrix.python-version == '3.12' }}
        run: make python-lint
      - name: Check Python typecheck
        if: ${{ matrix.python-version == '3.12' }}
        run: make python-typecheck
      - name: Check Python build
        if: ${{ matrix.python-version == '3.12' }}
        run: make python-build
      - name: Retain verified Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: |-
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
        if: ${{ matrix.python-version == '3.12' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - quality
      - javascript
      - npm-consumers
      - python
      - python-minimum
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/gate.ts
