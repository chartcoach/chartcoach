name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version-file: package.json
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript workspace
        run: vp run ready

  python:
    name: Python package ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --package chartcoach --all-groups --all-extras

      - name: Test Python package
        run: make python-test

      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: make python-format

      - name: Lint Python
        if: matrix.python-version == '3.12'
        run: make python-lint

      - name: Typecheck Python
        if: matrix.python-version == '3.12'
        run: make python-typecheck

      - name: Build Python package
        if: matrix.python-version == '3.12'
        run: make python-build
