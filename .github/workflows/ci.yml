name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up consumer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Locate consumer Node.js
        id: consumer-node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.3.0
          node-version-file: package.json
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript workspace
        run: vp run ready

      - name: Install browser runtime
        run: pnpm --filter @chartcoach/release exec playwright install --with-deps chromium

      - name: Verify npm distribution
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: |
          mkdir -p dist/release/npm
          npm pack ./packages/catalog --ignore-scripts --pack-destination dist/release/npm
          pnpm --filter @chartcoach/release verify:npm dist/release/npm/*.tgz --node "$CONSUMER_NODE"

  python-minimum:
    name: Python minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.10"
      - name: Test minimum dependency versions
        run: make python-minimum

  python:
    name: Python package ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --package chartcoach --all-groups --all-extras

      - name: Test Python package
        run: make python-test

      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: make python-format

      - name: Lint Python
        if: matrix.python-version == '3.12'
        run: make python-lint

      - name: Typecheck Python
        if: matrix.python-version == '3.12'
        run: make python-typecheck

      - name: Build Python package
        if: matrix.python-version == '3.12'
        run: make python-build
