name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.3.0
          node-version-file: package.json
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript workspace
        run: vp run ready

      - name: Read the SDK minimum Node.js version
        id: node-version
        run: |
          echo "version=$(pnpm --filter @chartcoach/release --silent minimum-node)" >> "$GITHUB_OUTPUT"
          echo "build_node=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up consumer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false

      - name: Locate consumer Node.js and restore the build runtime
        id: consumer-node
        env:
          BUILD_NODE: ${{ steps.node-version.outputs.build_node }}
        run: |
          echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
          dirname "$BUILD_NODE" >> "$GITHUB_PATH"

      - name: Install browser runtime
        run: pnpm --filter @chartcoach/release exec playwright install --with-deps chromium

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.6

      - name: Verify npm distribution
        id: npm-dist
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/chartcoach-npm.XXXXXX")"
          npm pack ./packages/catalog --ignore-scripts --pack-destination "$directory"
          pnpm --filter @chartcoach/release verify:npm "$directory"/*.tgz --node "$CONSUMER_NODE" --minimum-dependencies
          npm pack ./apps/chat/dist --ignore-scripts --pack-destination "$directory"
          pnpm --filter @chartcoach/release verify:chat "$directory"/chartcoach-[0-9]*.tgz "$directory"/chartcoach-catalog-*.tgz
          pnpm --filter @chartcoach/release verify:chat "$directory"/chartcoach-[0-9]*.tgz "$directory"/chartcoach-catalog-*.tgz https://artifacts.chartcoach.dev/catalog/releases/075004be49cba8fd604d3e89ed1fb2dbd1b18eebcda40fa56f5f247cc9f8aa59/release.json
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Verify Bun and Deno chat consumers
        env:
          PACKAGE_DIRECTORY: ${{ steps.npm-dist.outputs.directory }}
        run: |
          for runner in bunx bun deno; do
            pnpm --filter @chartcoach/release verify:chat "$PACKAGE_DIRECTORY"/chartcoach-[0-9]*.tgz "$PACKAGE_DIRECTORY"/chartcoach-catalog-*.tgz --runner "$runner"
          done

      - name: Retain chat browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-browser
          path: .context/chat-package-*.png
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Retain verified npm distribution
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.npm-dist.outputs.directory }}/*.tgz
          overwrite: true
          retention-days: 30
          if-no-files-found: error

  python-minimum:
    name: Python minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.10"
      - name: Test minimum dependency versions
        run: make python-minimum

  python:
    name: Python package ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --package chartcoach --all-groups --all-extras

      - name: Test Python package
        run: make python-test

      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: make python-format

      - name: Lint Python
        if: matrix.python-version == '3.12'
        run: make python-lint

      - name: Typecheck Python
        if: matrix.python-version == '3.12'
        run: make python-typecheck

      - name: Build Python package
        if: matrix.python-version == '3.12'
        run: make python-build

      - name: Retain verified Python distributions
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          overwrite: true
          path: |
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
          retention-days: 30
          if-no-files-found: error
