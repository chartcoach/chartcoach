name: Site CI

on:
  pull_request:
    paths:
      - ".github/workflows/site-ci.yml"
      - "apps/site/**"
      - "packages/chartcoach-js/**"
      - "guidelines/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
  push:
    paths:
      - ".github/workflows/site-ci.yml"
      - "apps/site/**"
      - "packages/chartcoach-js/**"
      - "guidelines/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-check-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm --filter site astro check

      - name: Build site
        env:
          SITE_URL: http://127.0.0.1:4321/
        run: pnpm --filter site build
