name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "apps/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: "4"
  CLOUDFLARE_PAGES_PROJECT: chartcoach-docs
  CLOUDFLARE_PAGES_PREVIEW_HOST: chartcoach-docs.pages.dev
  CLOUDFLARE_PAGES_PRODUCTION_URL: https://docs.chartcoach.dev/
  BUILD_OUTPUT_DIR: apps/docs/out

jobs:
  deploy:
    name: Deploy chartcoach-docs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm and install dependencies
        uses: pnpm/action-setup@v6
        with:
          standalone: true
          cache: true
          run_install: |
            - args: [--frozen-lockfile]

      - name: Verify package-managed Node
        run: pnpm exec node --version

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="pr-${{ github.event.pull_request.number }}"
            url="https://${branch}.${CLOUDFLARE_PAGES_PREVIEW_HOST}/"
          else
            branch="${GITHUB_REF_NAME}"
            url="${CLOUDFLARE_PAGES_PRODUCTION_URL}"
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Build docs
        run: pnpm --dir apps/docs build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy ${{ env.BUILD_OUTPUT_DIR }} --project-name ${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch ${{ steps.target.outputs.branch }} --commit-hash ${{ github.sha }}

      - name: Write deployment summary
        run: |
          {
            echo "### chartcoach docs"
            echo ""
            echo "- Project: \`${CLOUDFLARE_PAGES_PROJECT}\`"
            echo "- Branch: \`${{ steps.target.outputs.branch }}\`"
            echo "- URL: ${{ steps.target.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
