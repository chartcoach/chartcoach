name: Restore Vite Task cache
description: Restore task fingerprints and outputs after dependency installation.
inputs:
  scope:
    description: Job owning the cached task results.
    required: true
outputs:
  key:
    description: Key for saving the successful run.
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Restore Vite Task cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-
