[project]
name = "chartcoach-catalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.21",
    "duckdb>=1.3.2",
    "embedding-atlas @ https://files.peter.gy/pkg/py/embedding-atlas/embedding_atlas-0.12.0-py3-none-any.whl",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
chartcoach-catalog = "chartcoach_catalog:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo[mcp,recommended]>=0.18.0",
    "pytest>=9.0.1",
]
examples = [
    "bibtexparser>=1.4.3",
    "diskcache>=5.6.3",
    "draco @ https://files.peter.gy/pkg/py/draco/draco-2.0.1-py3-none-any.whl",
    "dspy>=3.0.4",
    "google-genai>=1.50.1",
    "httpx>=0.28.1",
    "joblib>=1.5.2",
    "litellm>=1.80.0",
    "moutils>=0.3.12",
    "nest-asyncio>=1.6.0",
    "pillow>=12.0.0",
    "pyzotero>=1.7.5",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "vega-lite-linter @ https://files.peter.gy/pkg/py/vega-lite-linter/vega_lite_linter-0.0.1-py3-none-any.whl",
]
