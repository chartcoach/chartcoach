[project]
name = "chartcoach"
version = "0.2.0"
description = "Python package and CLI for the chartcoach visualization guideline catalog."
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
keywords = ["data-visualization", "guidelines", "retrieval", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "agent-plugins>=0.2",
  "refkit>=0.3.0",
  "polars-refkit>=0.3.0",
  "click>=8.3.3",
  "duckdb>=1.5.5",
  "platformdirs>=4",
  "polars>=1.39.0",
  "pyyaml>=6",
  "tabulate>=0.10.0",
  "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
index = ["lancedb>=0.38.0", "pyarrow>=23.0.1"]
cloud = ["obstore>=0.11.0"]
mcp = ["mcp>=2.0", "pydantic>=2.12"]
curation = ["chartcoach[index,cloud]", "numpy>=1.24", "obspec>=0.1.0"]
projection = ["numpy>=1.24", "umap-learn>=0.5.12"]

[project.scripts]
chartcoach = "chartcoach.cli.main:main"

[project.entry-points."marimo.agent.capability"]
chartcoach = "chartcoach.agent"

[project.urls]
Repository = "https://github.com/chartcoach/chartcoach"
Issues = "https://github.com/chartcoach/chartcoach/issues"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.16", "ty>=0.0.11"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
  "curation: tests that require the chartcoach[curation] optional extra",
  "mcp: tests that require the chartcoach[mcp] optional extra",
  "search: tests that require the chartcoach[index] optional extra",
]

[tool.agent-plugins]
root = "../.."

[build-system]
requires = ["agent-plugins>=0.2", "uv_build>=0.12.0,<0.13"]
build-backend = "agent_plugins.build.uv_build"
