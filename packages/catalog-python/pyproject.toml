[project]
name = "chartcoach"
version = "0.1.0"
description = "Python package and CLI for the ChartCoach visualization guideline catalog."
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
keywords = [
  "chartcoach",
  "data-visualization",
  "guidelines",
  "retrieval",
  "visualization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "bibtexparser>=1.4",
  "click>=8.1",
  "citeproc-py>=0.9",
  "mdformat>=1.0.0",
  "polars>=1.38",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
chroma = [
  "chromadb>=1.5",
  "platformdirs>=4.9.4",
  "polars-hash>=0.5.6",
  "tqdm>=4.67",
]
sql = [
  "duckdb>=1.5",
  "pyarrow>=23",
]
search = [
  "chromadb>=1.5",
  "duckdb>=1.5",
  "platformdirs>=4.9.4",
  "polars-hash>=0.5.6",
  "pyarrow>=23",
  "tqdm>=4.67",
]
mcp = [
  "chromadb>=1.5",
  "duckdb>=1.5",
  "mcp[cli]",
  "platformdirs>=4.9.4",
  "polars-hash>=0.5.6",
  "pyarrow>=23",
  "tqdm>=4.67",
]

[project.scripts]
chartcoach = "chartcoach.cli.main:main"

[project.urls]
Repository = "https://github.com/peter-gy/chartcoach"
Issues = "https://github.com/peter-gy/chartcoach/issues"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["uv_build>=0.10.11,<0.12.0"]
build-backend = "uv_build"
