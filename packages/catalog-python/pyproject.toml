[project]
name = "chartcoach"
version = "0.1.0"
description = "Python package and CLI for the ChartCoach visualization guideline catalog."
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = [
  "chartcoach",
  "data-visualization",
  "guidelines",
  "retrieval",
  "visualization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "bibtexparser>=1.1.0",
  "click>=8.0.0",
  "citeproc-py>=0.9",
  "duckdb>=1.1",
  "mdformat>=1",
  "platformdirs>=4.0.0",
  "polars>=1.0.0",
  "pyarrow>=18",
  "pyyaml>=6",
]

[project.optional-dependencies]
search = [
  "chromadb>=1.5.0",
  "polars-hash>=0.5.0",
  "tqdm>=1.0",
]
mcp = [
  "mcp[cli]>=1.9.0",
]

[project.scripts]
chartcoach = "chartcoach.cli.main:main"

[project.urls]
Repository = "https://github.com/peter-gy/chartcoach"
Issues = "https://github.com/peter-gy/chartcoach/issues"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
markers = [
  "mcp: tests that require the chartcoach[mcp] optional extra",
  "search: tests that require the chartcoach[search] optional extra",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.12.0"]
build-backend = "uv_build"
