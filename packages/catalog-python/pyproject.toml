[project]
name = "chartcoach"
version = "0.0.0"
description = "Python package and CLI for the ChartCoach visualization guideline catalog."
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = [
  "data-visualization",
  "guidelines",
  "retrieval",
  "visualization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "bibtexparser>=1.1",
  "click>=8",
  "duckdb>=1.1",
  "mdformat>=1",
  "polars>=1",
  "pyarrow>=18",
  "pyyaml>=6",
]

[project.optional-dependencies]
index = [
  "lancedb>=0.33",
]
mcp = [
  "mcp[cli]>=1.9",
]

[project.scripts]
chartcoach = "chartcoach.cli.main:main"

[project.urls]
Repository = "https://github.com/peter-gy/chartcoach"
Issues = "https://github.com/peter-gy/chartcoach/issues"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
markers = [
  "mcp: tests that require the chartcoach[mcp] optional extra",
  "search: tests that require the chartcoach[index] optional extra",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.12.0"]
build-backend = "uv_build"
