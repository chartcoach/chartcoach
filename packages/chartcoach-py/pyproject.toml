[project]
name = "chartcoach"
version = "0.1.0"
description = "Chartcoach: structured visualization guidelines, catalog tooling, and retrieval primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mdformat>=1.0.0",
    "numpy>=2.3.5",
    "polars>=1.32.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
embedding = [
    "anywidget>=0.9.21",
    "embedding-atlas>=0.15.0",
]
retrieval = [
    "dspy>=3.1.2",
    "pillow>=10.0.0",
]
index = [
    "duckdb>=1.3.2",
    "lancedb>=0.27.0",
]
index-duckdb = [
    "duckdb>=1.3.2",
]
index-lance = [
    "lancedb>=0.27.0",
]
cataloging = [
    "diskcache>=5.6.3",
    "joblib>=1.5.2",
    "openai>=2.15.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
