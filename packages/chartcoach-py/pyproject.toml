[project]
name = "chartcoach"
version = "0.1.0"
description = "Chartcoach: structured visualization guidelines, catalog tooling, and retrieval primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bibtexparser>=1.4.4",
  "chromadb>=1.5.5",
  "citeproc-py>=0.9.0",
  "dspy>=3.1.2",
  "duckdb>=1.5.0",
  "mdformat>=1.0.0",
  "numpy>=2.3.5",
  "openai>=2.15.0",
  "pillow>=10.0.0",
  "platformdirs>=4.9.4",
  "polars>=1.32.0",
  "polars-hash>=0.5.6",
  "pyarrow>=20.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.67.3",
]
