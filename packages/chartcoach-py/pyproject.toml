[project]
name = "chartcoach"
version = "0.1.0"
description = "Chartcoach: structured visualization guidelines, catalog tooling, and retrieval primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.5.5",
  "diskcache>=5.6.3",
  "dspy>=3.1.2",
  "duckdb>=1.5.0",
  "joblib>=1.5.2",
  "mdformat>=1.0.0",
  "numpy>=2.3.5",
  "openai>=2.15.0",
  "pillow>=10.0.0",
  "polars>=1.32.0",
  "pyarrow>=20.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "tenacity>=9.1.2",
  "tqdm>=4.67.1",
]
