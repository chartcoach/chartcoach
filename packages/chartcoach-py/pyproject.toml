[project]
name = "chartcoach"
version = "0.1.0"
description = "Chartcoach: structured visualization guidelines, catalog tooling, and retrieval primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bibtexparser>=1.4.4",
  "click>=8.1.0",
  "chromadb>=1.5.5",
  "citeproc-py>=0.9.0",
  "duckdb>=1.5.0",
  "mdformat>=1.0.0",
  "platformdirs>=4.9.4",
  "polars>=1.32.0",
  "polars-hash>=0.5.6",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.67.3",
]

[project.optional-dependencies]
atlas = ["embedding-atlas>=0.6.0"]
mcp = ["mcp[cli]"]

[project.scripts]
chartcoach = "chartcoach.cli.main:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
