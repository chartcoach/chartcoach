[project]
name = "guideline-application"
version = "0.0.0"
description = "marimo notebook for catalog-grounded visualization feedback."
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
  "chartcoach",
  "draco==2.0.1",
  "dspy>=3.1.2",
  "httpx>=0.28.1",
  "marimo[recommended]",
  "pillow>=12.1.0",
]
[tool.uv.sources]
chartcoach = { path = "../../catalog-python", editable = true }

[tool.uv]
package = false
