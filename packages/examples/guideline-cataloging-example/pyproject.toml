[project]
name = "guideline-cataloging"
version = "0.0.0"
description = "marimo notebook for turning source material into ChartCoach catalog entries."
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
  "altair>=5.2,<6",
  "bibtexparser>=1.4.3",
  "chartcoach",
  "joblib>=1.5.3",
  "marimo[recommended]",
  "pyzotero>=1.8.0",
  "tenacity>=9.1.4",
  "tqdm>=4.67.3",
]

[tool.uv.sources]
chartcoach = { path = "../../catalog-python", editable = true }

[tool.uv]
package = false

[tool.marimo.runtime]
dotenv = ["../../../.env"]
