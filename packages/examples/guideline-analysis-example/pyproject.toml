[project]
name = "guideline-analysis"
version = "0.0.0"
description = "marimo notebook for structural analysis over the ChartCoach guideline catalog."
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
  "anywidget>=0.9.21",
  "chartcoach[search]",
  "embedding-atlas<0.20.0",
  "marimo[recommended]",
  "nest-asyncio>=1.6.0",
  "scikit-learn>=1.8.0",
  "sqlglot>=29.0.1",
]
[tool.uv.sources]
chartcoach = { path = "../../catalog-python", editable = true }

[tool.uv]
package = false

[tool.marimo.runtime]
dotenv = ["../../../.env"]
