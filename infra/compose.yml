name: chartcoach

services:
  chartcoach:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ${CHARTCOACH_IMAGE:-chartcoach:local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4273:4273"
    environment:
      CHARTCOACH_PASSWORD: ${CHARTCOACH_PASSWORD:?Set CHARTCOACH_PASSWORD before starting}
      CHARTCOACH_PUBLIC_URL: ${CHARTCOACH_PUBLIC_URL:-http://127.0.0.1:4273}
      CHARTCOACH_USERNAME: ${CHARTCOACH_USERNAME:-}
      CHARTCOACH_CATALOG: ${CHARTCOACH_CATALOG:-}
      CHARTCOACH_CATALOG_PROFILE: ${CHARTCOACH_CATALOG_PROFILE:-}
      CHARTCOACH_PROVIDER: ${CHARTCOACH_PROVIDER:-}
      CHARTCOACH_MODEL: ${CHARTCOACH_MODEL:-}
      CHARTCOACH_BASE_URL: ${CHARTCOACH_BASE_URL:-}
      CHARTCOACH_MODEL_AUTH: ${CHARTCOACH_MODEL_AUTH:-}
      CHARTCOACH_CONTEXT_WINDOW: ${CHARTCOACH_CONTEXT_WINDOW:-}
      CHARTCOACH_MODEL_ORIGINS: ${CHARTCOACH_MODEL_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHARTCOACH_TRACING: ${CHARTCOACH_TRACING:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    volumes:
      - chat-data:/data
      - chat-cache:/cache
    stop_grace_period: 15s
volumes:
  chat-data:
  chat-cache:
