name: chartcoach

services:
  chartcoach:
    build:
      context: ..
      dockerfile: infra/chat.Dockerfile
    image: ${CHARTCOACH_IMAGE:-chartcoach:local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4273:4273"
    environment:
      CHARTCOACH_PASSWORD: ${CHARTCOACH_PASSWORD:-}
      CHARTCOACH_PUBLIC: ${CHARTCOACH_PUBLIC:-}
      CHARTCOACH_PUBLIC_URL: ${CHARTCOACH_PUBLIC_URL:-http://127.0.0.1:4273}
      CHARTCOACH_USERNAME: ${CHARTCOACH_USERNAME:-}
      CHARTCOACH_EMBED_ORIGINS: ${CHARTCOACH_EMBED_ORIGINS:-}
      CHARTCOACH_EMBED_KEY: ${CHARTCOACH_EMBED_KEY:-}
      CHARTCOACH_CATALOG: ${CHARTCOACH_CATALOG:-}
      CHARTCOACH_CATALOG_PROFILE: ${CHARTCOACH_CATALOG_PROFILE:-}
      CHARTCOACH_GUIDELINE_URL_TEMPLATE: ${CHARTCOACH_GUIDELINE_URL_TEMPLATE:-}
      CHARTCOACH_GUIDELINE_IMAGE_URL_TEMPLATE: ${CHARTCOACH_GUIDELINE_IMAGE_URL_TEMPLATE:-}
      CHARTCOACH_TEXT_PROVIDER: ${CHARTCOACH_TEXT_PROVIDER:-}
      CHARTCOACH_TEXT_MODEL: ${CHARTCOACH_TEXT_MODEL:-}
      CHARTCOACH_TEXT_BASE_URL: ${CHARTCOACH_TEXT_BASE_URL:-}
      CHARTCOACH_TEXT_AUTH: ${CHARTCOACH_TEXT_AUTH:-}
      CHARTCOACH_TEXT_CONTEXT_WINDOW: ${CHARTCOACH_TEXT_CONTEXT_WINDOW:-}
      CHARTCOACH_MODEL_ORIGINS: ${CHARTCOACH_MODEL_ORIGINS:-}
      CHARTCOACH_TEXT_API_KEY: ${CHARTCOACH_TEXT_API_KEY:-}
      CHARTCOACH_TEXT_API_KEY_ENV: ${CHARTCOACH_TEXT_API_KEY_ENV:-}
      CHARTCOACH_EMBEDDING_MODEL: ${CHARTCOACH_EMBEDDING_MODEL:-}
      CHARTCOACH_EMBEDDING_DIMENSIONS: ${CHARTCOACH_EMBEDDING_DIMENSIONS:-}
      CHARTCOACH_EMBEDDING_BASE_URL: ${CHARTCOACH_EMBEDDING_BASE_URL:-}
      CHARTCOACH_EMBEDDING_API_KEY: ${CHARTCOACH_EMBEDDING_API_KEY:-}
      CHARTCOACH_EMBEDDING_API_KEY_ENV: ${CHARTCOACH_EMBEDDING_API_KEY_ENV:-}
      CHARTCOACH_TRACING: ${CHARTCOACH_TRACING:-false}
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
    volumes:
      - chat-data:/data
      - chat-cache:/cache
    stop_grace_period: 15s
volumes:
  chat-data:
  chat-cache:
