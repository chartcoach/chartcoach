[tool.uv.workspace]
members = [
    "packages/examples/guideline-cataloging-example",
    "packages/examples/guideline-analysis-example",
    "packages/examples/guideline-application-example",
    "packages/catalog-python",
    "apps/visground",
]

[tool.uv]
exclude-newer = "2 days"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.5",
    "ty>=0.0.11",
]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = []

[tool.marimo.runtime]
output_max_bytes = 10_000_000_000
