[tool.uv.workspace]
members = [
    "packages/chartcoach-py",
    "packages/examples/guideline-cataloging",
    "packages/examples/guideline-analysis",
    "packages/examples/guideline-application",
    "apps/visground",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.5",
    "ty>=0.0.11",
]

[tool.ruff]
extend-include = ["*.ipynb"]
extend-exclude = ["apps/visground/data"]
force-exclude = true

[tool.ruff.format]
exclude = ["apps/visground/data"]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = []

[tool.ty.src]
exclude = ["scripts", "apps/visground/data"]

[tool.marimo.runtime]
output_max_bytes = 10_000_000_000
